name: Windows PR validation

on:
  pull_request:
    branches: [main, fix/installer-host-prerequisites, design/quiet-workspace]

permissions:
  contents: read

concurrency:
  group: windows-test-installer-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      RENNIE_UNSIGNED_VALIDATION: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install build tools
        run: npm install --global pnpm@11.19.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Download the Electron build runtime
        run: node node_modules/electron/install.js
      - name: Check Host setup
        run: |
          node --test "test/unit/*.test.cjs"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell -NoProfile -ExecutionPolicy Bypass -File test/unit/host-setup.test.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell -NoProfile -ExecutionPolicy Bypass -File test/unit/host-progress.test.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell -NoProfile -ExecutionPolicy Bypass -File test/unit/engine-cleanup.test.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check normal chat request path
        run: pnpm exec electron test/smoke/local-chat-smoke.cjs
      - name: Check chat recovers from a failed save
        run: pnpm exec electron test/smoke/chat-persist-smoke.cjs
      - name: Check isolated development launch
        run: pnpm exec electron . --rennie-dev --fresh --dev-smoke
      - name: Check setup progress at a small laptop window size
        run: pnpm exec electron test/smoke/setup-progress-smoke.cjs
      - name: Check the full setup flow through OpenClaw (stand-ins, nothing installed)
        run: pnpm exec electron test/smoke/local-smoke.cjs
      - name: Check the workspace design offline
        run: pnpm exec electron test/smoke/design-smoke.cjs
      - name: Check closing during setup asks first
        run: pnpm exec electron test/smoke/local-lifecycle-smoke.cjs
      - name: Check signature rejection gate
        run: ./test/unit/verify-signature.test.ps1
      - name: Build Windows installer
        run: pnpm dist:dev
      - name: Check installer registration handling
        shell: pwsh
        run: |
          $compiler = Get-ChildItem "$env:LOCALAPPDATA/electron-builder/Cache" -Recurse -Filter makensis.exe | Where-Object { $_.Directory.Name -ne 'Bin' } | Select-Object -First 1
          if (-not $compiler) { throw 'NSIS compiler was not found after packaging' }
          powershell -NoProfile -ExecutionPolicy Bypass -File test/unit/install-identity.test.ps1 -MakeNsis $compiler.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Explain validation result
        run: |
          "Unsigned development installer only. Use a development PC configured by its owner to allow unsigned apps." >> $env:GITHUB_STEP_SUMMARY
          "This does not establish acceptance on a PC with Smart App Control enforced." >> $env:GITHUB_STEP_SUMMARY
      - name: Prepare development handoff
        env:
          TEST_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          New-Item -ItemType Directory -Path dev-installer | Out-Null
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          $version = $package.version
          # The installer name comes from build.win.artifactName, which has no spaces so GitHub serves it unrenamed.
          $installer = Get-Item -LiteralPath ('release/' + $package.build.win.artifactName.Replace('${version}',$version).Replace('${ext}','exe'))
          Copy-Item -LiteralPath $installer.FullName -Destination dev-installer
          $digest = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$digest  $($installer.Name)" | Set-Content dev-installer/SHA256SUMS.txt
          @{
            version = $version
            tested_head_sha = $env:TEST_HEAD_SHA
            checkout_sha = (git rev-parse HEAD)
            signature_status = (Get-AuthenticodeSignature -LiteralPath $installer.FullName).Status.ToString()
            purpose = 'Unsigned development build; requires an owner-configured development PC'
            run_url = "https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          } | ConvertTo-Json | Set-Content dev-installer/BUILD-INFO.json
          Copy-Item docs/testing.md dev-installer/TESTING.md
          Copy-Item docs/development.md dev-installer/DEVELOPMENT.md
      - uses: actions/upload-artifact@v4
        with:
          name: Rennie-Windows-UNSIGNED-DEVELOPMENT
          path: dev-installer/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
